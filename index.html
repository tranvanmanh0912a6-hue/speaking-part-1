<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Luyện phản xạ Nói Tiếng Anh - Vấn đáp</title>
  <style>
    :root {
      --bg: #0f172a;
      --card-bg: #1e293b;
      --text-main: #f8fafc;
      --text-sub: #94a3b8;
      --accent: #38bdf8;
      --accent-hover: #0284c7;
      --green: #22c55e;
      --green-hover: #16a34a;
      --border: #334155;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: var(--bg);
      color: var(--text-main);
      padding: 24px 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
    }

    .container {
      width: 100%;
      max-width: 760px;
    }

    header {
      text-align: center;
      margin-bottom: 24px;
    }

    h1 {
      font-size: 1.6rem;
      margin-bottom: 8px;
      color: var(--accent);
    }

    p.desc {
      color: var(--text-sub);
      font-size: 0.95rem;
    }

    .controls-top {
      display: flex;
      gap: 12px;
      justify-content: center;
      align-items: center;
      margin-bottom: 24px;
      flex-wrap: wrap;
    }

    .voice-selector, .speed-selector {
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }

    .speed-selector {
      background-color: #334155;
      padding: 6px 14px;
      border-radius: 8px;
      border: 1px solid var(--border);
    }

    .speed-selector input[type="range"] {
      cursor: pointer;
      accent-color: var(--accent);
    }

    select {
      background-color: #334155;
      color: #f8fafc;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 10px 14px;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      outline: none;
    }

    button {
      border: none;
      border-radius: 8px;
      padding: 10px 18px;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      transition: all 0.2s ease;
    }

    .btn-primary {
      background-color: var(--accent);
      color: #0f172a;
    }
    .btn-primary:hover {
      background-color: var(--accent-hover);
    }

    .btn-secondary {
      background-color: #334155;
      color: #f8fafc;
    }
    .btn-secondary:hover {
      background-color: #475569;
    }

    .card {
      background-color: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 18px;
      margin-bottom: 18px;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.2);
    }

    .card-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 14px;
      min-height: 26px;
    }

    .topic-tag {
      font-size: 0.8rem;
      color: var(--accent);
      background-color: rgba(56, 189, 248, 0.1);
      padding: 4px 10px;
      border-radius: 9999px;
      font-weight: 600;
    }

    .action-row {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-bottom: 14px;
    }

    .btn-audio {
      background-color: var(--green);
      color: #fff;
    }
    .btn-audio:hover {
      background-color: var(--green-hover);
    }

    .content-box {
      border-top: 1px dashed var(--border);
      padding-top: 14px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .hidden {
      display: none !important;
    }

    .q-text {
      color: #f1f5f9;
      font-size: 1.05rem;
      font-weight: 600;
    }

    .a-box {
      background-color: rgba(15, 23, 42, 0.6);
      border-left: 3px solid var(--accent);
      padding: 10px 14px;
      border-radius: 0 8px 8px 0;
      color: #cbd5e1;
      font-size: 0.95rem;
      line-height: 1.5;
    }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <h1>Luyện Phản Xạ Vấn Đáp (Speaking Part 1)</h1>
      <p class="desc">Luyện nghe câu hỏi ngẫu nhiên và chuẩn bị câu trả lời trước khi bấm hiện văn bản.</p>
    </header>

    <div class="controls-top">
      <div class="voice-selector">
        <label for="voiceGender" style="color: var(--text-sub); font-size: 0.9rem; font-weight: 600;">Giọng:</label>
        <select id="voiceGender">
          <option value="female">Nữ (Female)</option>
          <option value="male">Nam (Male)</option>
        </select>
      </div>

      <div class="speed-selector">
        <label for="voiceRate" style="color: var(--text-sub); font-size: 0.9rem; font-weight: 600;">Tốc độ:</label>
        <input type="range" id="voiceRate" min="0.5" max="1.5" step="0.1" value="0.9" 
               oninput="document.getElementById('rateVal').textContent = this.value + 'x'">
        <span id="rateVal" style="font-size: 0.85rem; min-width: 35px; font-weight: 600; color: var(--accent);">0.9x</span>
      </div>

      <button class="btn-primary" onclick="generateRandomSession(4)">
        🎲 Bắt đầu thi thử (Random 4 câu ngẫu nhiên)
      </button>
      <button class="btn-secondary" onclick="generateRandomSession(1)">
        🔄 Random 1 câu
      </button>
      <button class="btn-secondary" onclick="loadAllQuestions()">
        📋 Hiện tất cả câu hỏi
      </button>
    </div>

    <div id="questions-list"></div>
  </div>

  <script>
    const dataset = [

      { topic: "Topic 1: Accommodation", q: "How long have you lived in your house or apartment?", a: "I have lived in my house for more than ten years. It is a quite large and comfortable house." },
      { topic: "Topic 1: Accommodation", q: "Who do you live with?", a: "I live with my family. There are four people in my house: my parents, my younger sister, and me." },
      { topic: "Topic 1: Accommodation", q: "What's your favourite room where you live?", a: "My favorite room is my bedroom because it is quiet and perfect for relaxing." },
      { topic: "Topic 1: Accommodation", q: "Is there anything you don't like about where you live?", a: "In the countryside, I don't like the weather because there are often big storms in a year." },

      { topic: "Topic 2: Accommodation (Future & Habits)", q: "What kind of place do you think you will live in in the future?", a: "I think I will live in the countryside because it is quiet and comfortable." },
      { topic: "Topic 2: Accommodation (Future & Habits)", q: "Would you prefer to live in the city or the countryside?", a: "I like living in the countryside because it is quiet and comfortable." },
      { topic: "Topic 2: Accommodation (Future & Habits)", q: "Do you have a garden?", a: "Yes, I have a small garden behind my house. I plant vegetables and flowers in it." },
      { topic: "Topic 2: Accommodation (Future & Habits)", q: "Do you live on your own?", a: "No, I live with my family. There are four people in my house: my parents, my younger sister, and me." },
      { topic: "Topic 2: Accommodation (Future & Habits)", q: "Is it better to live on your own or with other people?", a: "I think living with other people is better because it’s more fun and helpful." },
      { topic: "Topic 2: Accommodation (Future & Habits)", q: "Which room do you spend most time in when you're at home?", a: "I spend the most time in my bedroom because I use it for studying, watching movies, and studying." },
      { topic: "Topic 2: Accommodation (Future & Habits)", q: "Have you ever moved house?", a: "No, I have never moved house because I am very happy with my current house." },

      { topic: "Topic 3: Hobbies and interests", q: "Now let's talk about hobbies and interests.", a: "My hobbies are listening to music and reading comics because that helps me relax after school." },
      { topic: "Topic 3: Hobbies and interests", q: "Tell us about your hobbies and interests.", a: "My hobbies are listening to music and reading comics because that helps me relax after school." },
      { topic: "Topic 3: Hobbies and interests", q: "Have you got any hobbies?", a: "My hobbies are listening to music and reading comics because that helps me relax after school." },

      { topic: "Topic 3: Hobbies and interests", q: "Is there a hobby you would like to start?", a: "I want to start playing soccer because it is fun and good for my health." },
      { topic: "Topic 3: Hobbies and interests", q: "What do you like to do at the weekend?", a: "On weekends, I play football with my friends because it is fun and good for my health." },

      { topic: "Topic 5: Travel", q: "Are you going on holiday this year?", a: "Yes, I am planning to go to Quy Nhon this year. I'm really looking forward to it because I really like this coastal city." },
      { topic: "Topic 5: Travel", q: "Do you like to travel on your own?", a: "No, I don't like traveling alone because it would be very sad and lonely." },
      { topic: "Topic 5: Travel", q: "What's your favourite way of travelling?", a: "My favorite way to travel is by motorbike because it allows me to move freely to places I like." },

      { topic: "Topic 6: Studying", q: "Tell us about studying.", a: "I like learning because it allows me to learn new things and improve my skills." },
      { topic: "Topic 6: Studying", q: "Do you enjoy studying English?", a: "Yes, I like learning English because it helps me communicate with people from different countries and cultures." },
      { topic: "Topic 6: Studying", q: "Have you got a favourite room to study in at home?", a: "My favorite study room at home is the bedroom because it's quiet and comfortable." },
      { topic: "Topic 6: Studying", q: "What time of day is your best time for studying?", a: "The best time for me to study is in the evening. It's quiet and comfortable." },
      { topic: "Topic 6: Studying", q: "Do you like to study online?", a: "No, I don't like study online because studying online for a long time makes my eyes tired." },

      { topic: "Topic 6: Studying", q: "Have you tried studying with other people?", a: "I studied with other people. I find it useful for speaking practice and collaboration." },
      { topic: "Topic 6: Studying", q: "Do you prefer studying alone or with other people?", a: "I like studying alone because it helps me focus better." },
      { topic: "Topic 6: Studying", q: "Which area of English do you find most difficult?", a: "I think vocabulary is the most difficult area of English. It's hard to remember it all." },

      { topic: "Topic 6: Studying", q: "Is there a subject you would like to study?", a: "I want to study math. Because it is my best subject." }
    ];

    function speakText(text) {
      if ('speechSynthesis' in window) {
        window.speechSynthesis.cancel();
        const utterance = new SpeechSynthesisUtterance(text);
        utterance.lang = 'en-US';

        const rateEl = document.getElementById("voiceRate");
        utterance.rate = rateEl ? parseFloat(rateEl.value) : 0.9;

        const voices = window.speechSynthesis.getVoices().filter(v => v.lang.startsWith('en'));
        const genderEl = document.getElementById("voiceGender");
        const gender = genderEl ? genderEl.value : 'female';

        let selectedVoice = null;
        if (gender === 'male') {
          selectedVoice = voices.find(v => /male|david|mark|george|guy|daniel|james/i.test(v.name));
        } else {
  // Ưu tiên số 1: Giọng Google Dịch (Google US English)
  selectedVoice = voices.find(v => /google us english/i.test(v.name))
               || voices.find(v => /female|zira|jenny|samantha|victoria|karen|susan/i.test(v.name));
}

        if (selectedVoice) {
          utterance.voice = selectedVoice;
        } else if (voices.length > 0) {
          utterance.voice = voices[0];
        }

        window.speechSynthesis.speak(utterance);
      } else {
        alert("Trình duyệt của bạn không hỗ trợ tính năng đọc âm thanh (Speech Synthesis).");
      }
    }

    if ('speechSynthesis' in window) {
      window.speechSynthesis.onvoiceschanged = () => {
        window.speechSynthesis.getVoices();
      };
    }

    function renderList(list) {
      const container = document.getElementById("questions-list");
      container.innerHTML = "";

      list.forEach((item, index) => {
        const card = document.createElement("div");
        card.className = "card";

        card.innerHTML = `
          <div class="card-header">
            <span id="t-${index}" class="topic-tag hidden">${item.topic}</span>
            <span style="color: var(--text-sub); font-size: 0.85rem; margin-left: auto;">Câu ${index + 1}</span>
          </div>

          <div class="action-row">
            <button class="btn-audio" onclick="speakText('${escapeQuotes(item.q)}')">
              🔊 Nghe câu hỏi
            </button>
            <button class="btn-secondary" onclick="toggleVisibility('t-${index}', this, '🏷️ Hiện chủ đề', 'Ẩn chủ đề')">
              🏷️ Hiện chủ đề
            </button>
            <button class="btn-secondary" onclick="toggleVisibility('q-${index}', this, '👁️ Hiện câu hỏi', 'Ẩn câu hỏi')">
              👁️ Hiện câu hỏi
            </button>
            <button class="btn-secondary" onclick="toggleVisibility('a-${index}', this, '📝 Hiện đáp án', 'Ẩn đáp án')">
              📝 Hiện đáp án
            </button>
          </div>

          <div class="content-box">
            <div id="q-${index}" class="q-text hidden">❓ ${item.q}</div>
            <div id="a-${index}" class="a-box hidden">💡 <b>Đáp án chuẩn:</b><br>${item.a}</div>
          </div>
        `;
        container.appendChild(card);
      });
    }

    function toggleVisibility(id, btn, showText, hideText) {
      const el = document.getElementById(id);
      if (el.classList.contains("hidden")) {
        el.classList.remove("hidden");
        btn.textContent = hideText;
      } else {
        el.classList.add("hidden");
        btn.textContent = showText;
      }
    }

    function escapeQuotes(str) {
      return str.replace(/'/g, "\\'").replace(/"/g, '&quot;');
    }

    function generateRandomSession(count) {
      const shuffled = [...dataset].sort(() => 0.5 - Math.random());
      const selected = shuffled.slice(0, count);
      renderList(selected);
      if (selected.length > 0) {
        setTimeout(() => speakText(selected[0].q), 300);
      }
    }

    function loadAllQuestions() {
      renderList(dataset);
    }

    window.onload = () => {
      generateRandomSession(4);
    };
  </script>
</body>
</html>
